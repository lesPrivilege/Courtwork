<svg class="fig" viewBox="0 0 360 248" role="img" aria-labelledby="fig-roles-title fig-roles-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-roles-title">Roles and execution · research sketch</title>
  <desc id="fig-roles-desc">研究方向示意，尚未交付。上方三个 Expert 是可换的方法，一次只有一个作用于同一 Matter；换方法不改变 Matter。下方执行载体只有 Pi 在用，另外两个是空位，未接入，有实际需要时逐一验证。</desc>
  <defs>
    <marker id="fig-roles-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <text class="fig-label" x="8" y="14" font-size="11">EXPERT · ROLE, SWAPPABLE</text>
  <g data-node="method-a">
    <rect class="fig-node" x="8" y="22" width="104" height="36" />
    <text x="60" y="45" font-size="12" text-anchor="middle">method A</text>
  </g>
  <g data-node="method-b">
    <rect class="fig-node fig-engaged" x="128" y="22" width="104" height="36" />
    <text x="180" y="45" font-size="12" text-anchor="middle">method B</text>
  </g>
  <g data-node="method-c">
    <rect class="fig-node" x="248" y="22" width="104" height="36" />
    <text x="300" y="45" font-size="12" text-anchor="middle">method C</text>
  </g>
  <line class="fig-edge" data-edge="method-matter" x1="180" y1="60" x2="180" y2="88" marker-end="url(#fig-roles-arrow)" />
  <g data-node="matter">
    <rect class="fig-node fig-centre" x="8" y="92" width="344" height="52" />
    <text class="fig-th" x="20" y="114" font-size="15">Matter</text>
    <text class="fig-muted" x="20" y="134" font-size="12">methods change; the work does not</text>
  </g>
  <line class="fig-edge" data-edge="matter-pi" x1="60" y1="146" x2="60" y2="180" marker-end="url(#fig-roles-arrow)" />
  <text class="fig-label" x="72" y="172" font-size="11">RUNTIME · EXECUTION</text>
  <g data-node="pi">
    <rect class="fig-node fig-engaged" x="8" y="184" width="104" height="36" />
    <text x="60" y="207" font-size="12" text-anchor="middle">Pi · in use</text>
  </g>
  <g data-node="slot-2">
    <rect class="fig-slot" x="128" y="184" width="104" height="36" />
    <text class="fig-muted" x="180" y="207" font-size="12" text-anchor="middle">not connected</text>
  </g>
  <g data-node="slot-3">
    <rect class="fig-slot" x="248" y="184" width="104" height="36" />
    <text class="fig-muted" x="300" y="207" font-size="12" text-anchor="middle">not connected</text>
  </g>
  <text class="fig-muted" x="128" y="240" font-size="11">verify one at a time, when needed</text>
</svg>
