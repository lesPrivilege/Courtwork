[package]
name = "courtwork-desktop"
version = "0.1.2"
description = "Courtwork 法律工作台"
authors = ["Courtwork"]
edition = "2021"

[lib]
name = "courtwork_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4.1.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# CONTRACT-OUTPUT-TRUTH-1：只供 case-output 的 stat/write。sha2 用于产物 SHA-256 流式核验；
# libc 只用于 dirfd / no-follow / *at 系列调用。二者不得扩成通用路径读取 API。
# PI-HOST-LOOP-1 §二.5：libc 用途另加 `pi_loop_process` 的 `kill(pid, SIGTERM)` 与 `geteuid`——
# SIGTERM 必须由既有 libc::kill 完成，`Child::kill()` 只可用于 SIGKILL，不得改用外部
# `/bin/kill` 或新增 spawn；sha2 用途另加 route manifest 与 journal quarantine 的 SHA-256。
# 依赖集合与版本均不变。
sha2 = "0.10.9"
libc = "0.2.186"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow", "NSPanel", "NSSavePanel", "NSOpenPanel", "NSApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSString", "NSArray", "NSURL"] }
