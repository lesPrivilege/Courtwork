<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="-3 -3 70 70" role="img" aria-labelledby="cw-review-hierarchical-title" data-concept="review" data-material="hierarchical" data-requested-material="hierarchical" data-presence="present" data-authority="none" data-activity="idle" data-theme="light" data-geometry-sha256="522d4303216259490fb501458391431e8329a6aff8cfa3b463be6573d4614556">
 <title id="cw-review-hierarchical-title">CourtWork review</title>
 <style>
 svg{color:var(--cw-color,var(--cw-ink,#283849));overflow:visible}
 .hint{opacity:.28}.part{transform-box:fill-box;transform-origin:center}.record{transform-origin:left center}
 [data-presence="available"] .actor{opacity:.38}[data-presence="absent"] .actor{opacity:0}
 [data-concept="commit"] [data-layer="settled"]{opacity:0}[data-concept="commit"][data-activity="complete"] [data-layer="settled"]{opacity:1}
 [data-authority="requested"] [data-layer="boundary"]{stroke-dasharray:3 3}[data-authority="revoked"] [data-layer="boundary"]{opacity:.4}
 @media(forced-colors:active){.part rect{fill:CanvasText!important;stroke:none!important;filter:none!important}[filter]{filter:none!important}[data-layer="glow"]{display:none}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
 </style>
 <defs>
 <linearGradient id="cw-review-hierarchical-face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset=".38" stop-color="#bacbda" stop-opacity=".76"/><stop offset="1" stop-color="#6f889e"/></linearGradient>
 <linearGradient id="cw-review-hierarchical-rim" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#fff"/><stop offset=".42" stop-color="#b6c9d7" stop-opacity=".42"/><stop offset=".68" stop-color="#536e86"/><stop offset="1" stop-color="#e4eff9"/></linearGradient>
 <linearGradient id="cw-review-hierarchical-light" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".76"/><stop offset=".45" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#fff" stop-opacity=".16"/></linearGradient>
 <filter id="cw-review-hierarchical-shadow" x="-55%" y="-35%" width="210%" height="190%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="1.8" stdDeviation="1.2" flood-color="#1e344a" flood-opacity=".2"/></filter>
 <filter id="cw-review-hierarchical-glow" x="-60%" y="-40%" width="220%" height="200%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="1.35"/></filter>
 </defs>
 <rect data-layer="comparison" x="31" y="41" width="19.2" height="9.6" rx="2.8" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".35"/>
 <g data-layer="actor" class="part actor"><rect x="7.2" y="4" width="11.2" height="52.8" rx="2" fill="var(--cw-ink,#283849)"/></g><g data-layer="line line-1" class="part record"><rect x="28" y="7.2" width="28" height="9.6" rx="2.8" fill="var(--cw-record,#6f8191)"/></g><g data-layer="line line-2" class="part record"><rect x="28" y="25.6" width="28" height="9.6" rx="2.8" fill="var(--cw-record,#6f8191)"/></g><g data-layer="line line-3" class="part record"><rect x="28" y="44" width="19.2" height="9.6" rx="2.8" fill="var(--cw-record,#6f8191)"/></g><path data-layer="amendment" d="M28 59h19" fill="none" stroke="var(--cw-amend,#865a4f)" stroke-width="1.8" stroke-linecap="round"/>
 </svg>
