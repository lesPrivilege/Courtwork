<svg class="fig" viewBox="0 0 960 500" role="img" aria-labelledby="fig-pipeline-title fig-pipeline-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-pipeline-title">Store → Govern → Retrieve → Compile</title>
  <desc id="fig-pipeline-desc">概念示意，依据 Schema Engineering 9.6 §5.4。Store 保存来源、事件、成果版本、原始历史与当前状态，并持续增长。Govern 是重心：contract、status、version、authority 与 applicability 让对象可以被选择。Retrieve 只定位潜在相关对象；可读不等于已生效。Compile 为当前 assignment、role 与 task stage 编出最小充分的 Context Projection。Run 的提议经候选、审阅与提交后回到 Store。下方对照：存量变大，单次工作集的宽度不变。</desc>
  <defs>
    <marker id="fig-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <g data-node="store">
    <rect class="fig-node" x="16" y="48" width="176" height="252" />
    <text class="fig-th" x="32" y="78" font-size="17">Store</text>
    <text class="fig-muted" x="32" y="98" font-size="12">preserve</text>
    <text x="32" y="136" font-size="12">sources</text>
    <text x="32" y="160" font-size="12">events</text>
    <text x="32" y="184" font-size="12">artifact versions</text>
    <text x="32" y="208" font-size="12">raw history</text>
    <text x="32" y="232" font-size="12">current state</text>
    <text class="fig-muted" x="32" y="282" font-size="12">keeps growing</text>
  </g>
  <line class="fig-edge" data-edge="store-govern" x1="194" y1="174" x2="228" y2="174" marker-end="url(#fig-pipeline-arrow)" />
  <g data-node="govern">
    <rect class="fig-node fig-centre" x="232" y="48" width="300" height="252" />
    <text class="fig-th" x="252" y="82" font-size="22">Govern</text>
    <text class="fig-muted" x="252" y="104" font-size="12">makes objects selectable</text>
    <text x="252" y="140" font-size="13">contract</text>
    <line class="fig-rule" data-deco="govern" x1="252" y1="150" x2="512" y2="150" />
    <text x="252" y="170" font-size="13">status</text>
    <line class="fig-rule" data-deco="govern" x1="252" y1="180" x2="512" y2="180" />
    <text x="252" y="200" font-size="13">version</text>
    <line class="fig-rule" data-deco="govern" x1="252" y1="210" x2="512" y2="210" />
    <text x="252" y="230" font-size="13">authority</text>
    <line class="fig-rule" data-deco="govern" x1="252" y1="240" x2="512" y2="240" />
    <text x="252" y="260" font-size="13">applicability</text>
    <line class="fig-rule" data-deco="govern" x1="252" y1="270" x2="512" y2="270" />
  </g>
  <line class="fig-edge" data-edge="govern-retrieve" x1="534" y1="174" x2="568" y2="174" marker-end="url(#fig-pipeline-arrow)" />
  <g data-node="retrieve">
    <rect class="fig-node" x="572" y="48" width="160" height="252" />
    <text class="fig-th" x="588" y="78" font-size="17">Retrieve</text>
    <text class="fig-muted" x="588" y="98" font-size="12">possibly relevant</text>
    <rect class="fig-candidate" x="588" y="124" width="128" height="26" />
    <text class="fig-muted" x="600" y="141" font-size="12">object</text>
    <rect class="fig-candidate" x="588" y="158" width="128" height="26" />
    <text class="fig-muted" x="600" y="175" font-size="12">object</text>
    <rect class="fig-candidate" x="588" y="192" width="128" height="26" />
    <text class="fig-muted" x="600" y="209" font-size="12">object</text>
    <text x="588" y="256" font-size="12">readable</text>
    <text x="588" y="276" font-size="12">≠ in effect</text>
  </g>
  <line class="fig-edge" data-edge="retrieve-compile" x1="734" y1="174" x2="768" y2="174" marker-end="url(#fig-pipeline-arrow)" />
  <g data-node="compile">
    <rect class="fig-node" x="772" y="48" width="172" height="252" />
    <text class="fig-th" x="788" y="78" font-size="17">Compile</text>
    <text class="fig-muted" x="788" y="98" font-size="12">the working set</text>
    <rect class="fig-node fig-set" x="804" y="126" width="108" height="110" />
    <text x="858" y="164" font-size="12" text-anchor="middle">context</text>
    <text x="858" y="186" font-size="12" text-anchor="middle">projection</text>
    <text class="fig-muted" x="858" y="212" font-size="11" text-anchor="middle">per assignment</text>
    <text class="fig-muted" x="788" y="272" font-size="12">minimal, sufficient</text>
  </g>
  <line class="fig-edge" data-edge="compile-run" x1="858" y1="302" x2="858" y2="336" marker-end="url(#fig-pipeline-arrow)" />
  <g data-node="run">
    <rect class="fig-node" x="772" y="340" width="172" height="44" />
    <text class="fig-th" x="788" y="367" font-size="14">Run</text>
    <text class="fig-muted" x="828" y="367" font-size="12">model · tools</text>
  </g>
  <path class="fig-edge" data-edge="run-store" d="M 770 362 L 104 362 L 104 304" marker-end="url(#fig-pipeline-arrow)" />
  <text class="fig-muted" x="300" y="352" font-size="12">candidate → review → commit</text>
  <line class="fig-rule" data-deco="strip" x1="16" y1="398" x2="944" y2="398" />
  <text class="fig-label" x="16" y="422" font-size="11">STOCK GROWS · THE WORKING SET DOES NOT</text>
  <text class="fig-label" x="16" y="453" font-size="11">EARLIER</text>
  <g data-node="stock-earlier">
    <rect class="fig-stock" x="104" y="440" width="120" height="16" />
    <line class="fig-strata" data-deco="stock-earlier" x1="104" y1="448" x2="224" y2="448" />
  </g>
  <line class="fig-trace" data-edge="compile-earlier" x1="226" y1="448" x2="802" y2="448" />
  <rect class="fig-node fig-set" data-node="set-earlier" x="804" y="440" width="108" height="16" />
  <text class="fig-label" x="16" y="485" font-size="11">LATER</text>
  <g data-node="stock-later">
    <rect class="fig-stock" x="104" y="472" width="560" height="16" />
    <line class="fig-strata" data-deco="stock-later" x1="104" y1="480" x2="664" y2="480" />
  </g>
  <line class="fig-trace" data-edge="compile-later" x1="666" y1="480" x2="802" y2="480" />
  <rect class="fig-node fig-set" data-node="set-later" x="804" y="472" width="108" height="16" />
</svg>
