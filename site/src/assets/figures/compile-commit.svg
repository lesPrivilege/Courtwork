<svg class="fig" viewBox="0 0 960 560" role="img" aria-labelledby="fig-compile-title fig-compile-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-compile-title">From requirements to a run, from a run to a decision</title>
  <desc id="fig-compile-desc">Inputs — the Expert, the Matter projection, role and stage, organization policy, the available capabilities and the authority envelope — are compiled by the Work Compiler into a frozen Run Plan. The Runtime Adapter realizes the plan on the runtime in use. The run yields observations (a record, not a work fact) and proposes candidates through the domain adapter. A candidate reaches effect only through Review and Authority — here the instance where a person decides — and the Core's commit transaction; execution success does not commit. The effective state becomes the next run's projection. Work queries and decisions go to the Core; run control and events belong to the host runtime owner; neither passes through the compiler.</desc>
  <defs>
    <marker id="fig-compile-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <text class="fig-label" x="16" y="24" font-size="11">COMPILE</text>
  <text class="fig-label" x="500" y="24" font-size="11">EXECUTE</text>
  <text class="fig-label" x="270" y="336" font-size="11">COMMIT · A DIFFERENT PATH</text>

  <g data-node="in-expert"><rect class="fig-node" x="16" y="40" width="216" height="34" /><text x="28" y="62" font-size="12">Expert</text><text class="fig-muted" x="100" y="62" font-size="11">declares requirements</text></g>
  <g data-node="in-projection"><rect class="fig-node" x="16" y="82" width="216" height="34" /><text x="28" y="104" font-size="12">Matter projection</text><text class="fig-muted" x="150" y="104" font-size="11">versions</text></g>
  <g data-node="in-role"><rect class="fig-node" x="16" y="124" width="216" height="34" /><text x="28" y="146" font-size="12">Role · stage</text></g>
  <g data-node="in-policy"><rect class="fig-node" x="16" y="166" width="216" height="34" /><text x="28" y="188" font-size="12">Organization policy</text></g>
  <g data-node="in-authority"><rect class="fig-node" x="16" y="208" width="216" height="34" /><text x="28" y="230" font-size="11">Capabilities · authority envelope</text></g>
  <path class="fig-edge" data-edge="inputs-compiler" d="M 234 57 H 250 V 223 H 234 M 250 140 H 266" marker-end="url(#fig-compile-arrow)" />

  <g data-node="compiler">
    <rect class="fig-node fig-centre" x="270" y="110" width="180" height="60" />
    <text class="fig-th" x="286" y="136" font-size="15">Work Compiler</text>
    <text class="fig-muted" x="286" y="156" font-size="10.5">intersects, selects, freezes</text>
  </g>
  <line class="fig-edge" data-edge="compiler-plan" x1="452" y1="140" x2="496" y2="140" marker-end="url(#fig-compile-arrow)" />
  <text class="fig-muted" x="456" y="132" font-size="10.5">emits</text>
  <g data-node="plan">
    <rect class="fig-node fig-set" x="500" y="110" width="170" height="60" />
    <text class="fig-th" x="516" y="136" font-size="13">Run Plan</text>
    <text class="fig-muted" x="516" y="156" font-size="11">frozen for this run</text>
  </g>
  <line class="fig-edge" data-edge="plan-adapter" x1="672" y1="140" x2="716" y2="140" marker-end="url(#fig-compile-arrow)" />
  <g data-node="adapter">
    <rect class="fig-node" x="720" y="110" width="224" height="60" />
    <text class="fig-th" x="736" y="136" font-size="13">Runtime Adapter</text>
    <text class="fig-muted" x="736" y="156" font-size="11">run control · events · recovery</text>
  </g>
  <line class="fig-edge" data-edge="adapter-runtime" x1="832" y1="172" x2="832" y2="206" marker-end="url(#fig-compile-arrow)" />
  <text class="fig-muted" x="842" y="194" font-size="10.5">realizes on</text>
  <g data-node="runtime">
    <rect class="fig-node fig-engaged" x="720" y="208" width="224" height="44" />
    <text class="fig-th" x="736" y="235" font-size="13">Runtime</text>
    <text class="fig-muted" x="806" y="235" font-size="11">Pi in use · see F3</text>
  </g>

  <path class="fig-edge" data-edge="runtime-observations" d="M 720 230 H 690 V 296 H 672" marker-end="url(#fig-compile-arrow)" />
  <g data-node="observations">
    <rect class="fig-node" x="500" y="272" width="190" height="50" />
    <text class="fig-th" x="516" y="292" font-size="12">Run observations</text>
    <text class="fig-muted" x="516" y="310" font-size="11">a record, not a work fact</text>
  </g>
  <path class="fig-edge" data-edge="runtime-candidate" d="M 700 254 V 380 H 452" marker-end="url(#fig-compile-arrow)" />
  <text class="fig-muted" x="690" y="372" font-size="10.5" text-anchor="end">proposes · domain adapter validates</text>
  <g data-node="candidate">
    <rect class="fig-candidate" x="270" y="352" width="180" height="56" />
    <text class="fig-th" x="286" y="376" font-size="13">Candidate</text>
    <text class="fig-muted" x="286" y="396" font-size="11">bound to a source revision</text>
  </g>
  <line class="fig-edge" data-edge="candidate-review" x1="360" y1="410" x2="360" y2="444" marker-end="url(#fig-compile-arrow)" />
  <text class="fig-muted" x="370" y="432" font-size="10.5">validation · evidence</text>
  <g data-node="review">
    <rect class="fig-node fig-centre" x="270" y="446" width="400" height="72" />
    <text class="fig-th" x="286" y="472" font-size="15">Review · Authority</text>
    <circle id="compile-commit-decision" class="fig-attention" data-red="person" cx="440" cy="467" r="5" />
    <text x="452" y="472" font-size="12" font-weight="600">a person decides</text>
    <text class="fig-muted" x="286" y="494" font-size="11">Work API carries the decision:</text><text class="fig-muted" x="286" y="510" font-size="11">reject · request evidence · accept this version</text>
  </g>
  <line class="fig-edge" data-edge="review-commit" x1="672" y1="482" x2="716" y2="482" marker-end="url(#fig-compile-arrow)" />
  <text class="fig-muted" x="676" y="474" font-size="10.5">accepts</text>
  <g data-node="commit">
    <rect class="fig-node" x="720" y="446" width="224" height="72" />
    <text class="fig-th" x="736" y="472" font-size="13">Commit</text>
    <text class="fig-muted" x="736" y="492" font-size="11">Work Core transaction · event</text>
  </g>
  <line class="fig-edge" data-edge="commit-effective" x1="832" y1="520" x2="832" y2="530" marker-end="url(#fig-compile-arrow)" />
  <g data-node="effective">
    <rect class="fig-node fig-set" x="720" y="532" width="224" height="24" />
    <text x="736" y="549" font-size="11">Effective state → next projection</text>
  </g>
  <path class="fig-trace" data-edge="effective-projection" d="M 718 544 H 6 V 99 H 14" marker-end="url(#fig-compile-arrow)" />

  <text class="fig-muted" x="16" y="290" font-size="12">Execution success is not a commit.</text>
  <text class="fig-muted" x="16" y="310" font-size="12">Trace, candidate and effective state</text>
  <text class="fig-muted" x="16" y="330" font-size="12">are three different things.</text>
  <text class="fig-muted" x="16" y="366" font-size="12">Tool permission (host policy) and</text>
  <text class="fig-muted" x="16" y="386" font-size="12">outcome acceptance (Review) are two</text>
  <text class="fig-muted" x="16" y="406" font-size="12">gates with two owners.</text>
  <text class="fig-muted" x="16" y="442" font-size="12">Work queries and decisions go to the</text>
  <text class="fig-muted" x="16" y="462" font-size="12">Core; run control and events belong to</text><text class="fig-muted" x="16" y="482" font-size="12">the host runtime owner. Neither passes</text><text class="fig-muted" x="16" y="502" font-size="12">through the compiler.</text>
</svg>
