<svg class="fig" viewBox="0 0 1000 690" role="img" aria-labelledby="fig-ownership-title fig-ownership-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-ownership-title">What CourtWork owns, what can be replaced</title>
  <desc id="fig-ownership-desc">CourtWork keeps work state, sources, evidence and decisions in the Work Core. The Work Surface reaches it through the Work API. Expert declares requirements without granting authority. The Work Compiler is a planned responsibility that prepares a frozen Run Plan. The runtime boundary separates these work responsibilities from execution, model connections and the environment. Pi is the runtime in use; Codex and DSH are unconnected candidates. Candidates return through the work adapter, while execution events go to the host runtime store. Formal work changes follow Review, authority and Core commitment.</desc>
  <defs>
    <marker id="fig-ownership-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>
  <text class="fig-label" x="16" y="24" font-size="11">COURTWORK OWNS · DURABLE WORK SEMANTICS</text>

  <g data-node="work-surface">
    <rect class="fig-node" x="16" y="40" width="280" height="60" />
    <text class="fig-th" x="32" y="66" font-size="15">Work Surface</text>
    <text class="fig-muted" x="32" y="86" font-size="12">Matter · Review · Attention · Settings</text>
  </g>
  <line class="fig-edge" data-edge="surface-core" x1="156" y1="102" x2="156" y2="148" marker-start="url(#fig-ownership-arrow)" marker-end="url(#fig-ownership-arrow)" />
  <text class="fig-muted" x="168" y="129" font-size="11.5">Work API · intents, queries, decisions</text>

  <g data-node="work-core">
    <rect class="fig-node fig-centre" x="16" y="150" width="280" height="100" />
    <text class="fig-th" x="32" y="178" font-size="17">Work Core</text>
    <text class="fig-muted" x="32" y="200" font-size="12">state · evidence · authority · commitment</text>
    <text x="32" y="224" font-size="12">the only domain owner of effect</text>
    <text class="fig-muted" x="32" y="242" font-size="11">authority checked at commitment</text>
  </g>

  <g data-node="expert">
    <rect class="fig-node" x="360" y="150" width="300" height="100" />
    <text class="fig-th" x="376" y="178" font-size="15">Expert</text>
    <text class="fig-muted" x="376" y="200" font-size="12">Schema · Work Contract</text>
    <text class="fig-muted" x="376" y="218" font-size="12">capability needs · verifier · review</text>
    <text class="fig-label" x="376" y="240" font-size="10.5">A PACKAGE · DECLARES, NEVER GRANTS</text>
  </g>

  <path class="fig-edge" data-edge="core-compiler" d="M 296 200 H 336 V 330 H 358" marker-end="url(#fig-ownership-arrow)" />
  <text class="fig-muted" x="342" y="262" font-size="10.5">projection ·</text><text class="fig-muted" x="342" y="276" font-size="10.5">policy ·</text><text class="fig-muted" x="342" y="290" font-size="10.5">authority</text>
  <line class="fig-edge" data-edge="expert-compiler" x1="510" y1="252" x2="510" y2="298" marker-end="url(#fig-ownership-arrow)" />
  <text class="fig-muted" x="520" y="279" font-size="11.5">declares requirements</text>

  <g data-node="work-compiler">
    <rect class="fig-node" x="360" y="300" width="300" height="60" />
    <text class="fig-th" x="376" y="326" font-size="15">Work Compiler</text>
    <text class="fig-muted" x="376" y="346" font-size="11.5">planned · binds work requirements</text>
  </g>
  <line class="fig-edge" data-edge="compiler-plan" x1="510" y1="362" x2="510" y2="398" marker-end="url(#fig-ownership-arrow)" />
  <text class="fig-muted" x="520" y="384" font-size="11.5">emits</text>
  <g data-node="run-plan">
    <rect class="fig-node fig-set" x="360" y="400" width="300" height="48" />
    <text class="fig-th" x="376" y="421" font-size="13">Run Plan</text>
    <text class="fig-muted" x="376" y="439" font-size="11">frozen: context · requirements · permissions</text>
  </g>

  <line class="fig-threshold" data-deco="boundary" x1="16" y1="474" x2="984" y2="474" stroke-width="1.5" />
  <text class="fig-label" x="984" y="466" font-size="11" text-anchor="end">STABLE RUNTIME BOUNDARY · PROTOCOL ENDS AT THE ADAPTER</text>
  <text class="fig-label" x="16" y="496" font-size="11">REPLACEABLE EXECUTION</text>

  <line class="fig-edge" data-edge="plan-adapter" x1="510" y1="450" x2="510" y2="496" marker-end="url(#fig-ownership-arrow)" />
  <g data-node="runtime-adapter">
    <rect class="fig-node" x="360" y="498" width="300" height="56" />
    <text class="fig-th" x="376" y="521" font-size="14">Runtime Adapter</text>
    <text class="fig-muted" x="376" y="540" font-size="11">run control · events · recovery · host protocol</text>
  </g>
  <line class="fig-edge" data-edge="adapter-runtime" x1="400" y1="556" x2="400" y2="586" marker-end="url(#fig-ownership-arrow)" />
  <text class="fig-muted" x="410" y="575" font-size="11">realizes on</text>
  <g data-node="runtime-pi">
    <rect class="fig-node fig-engaged" x="360" y="588" width="82" height="36" />
    <text x="401" y="606" font-size="12" text-anchor="middle">Pi</text>
    <text class="fig-muted" x="401" y="619" font-size="9.5" text-anchor="middle">in use</text>
  </g>
  <g data-node="runtime-codex">
    <rect class="fig-slot" x="360" y="636" width="82" height="36" />
    <text class="fig-muted" x="401" y="654" font-size="12" text-anchor="middle">Codex</text>
    <text class="fig-muted" x="401" y="667" font-size="9.5" text-anchor="middle">candidate</text>
  </g>
  <g data-node="runtime-dsh">
    <rect class="fig-slot" x="452" y="636" width="82" height="36" />
    <text class="fig-muted" x="493" y="654" font-size="12" text-anchor="middle">DSH</text>
    <text class="fig-muted" x="493" y="667" font-size="9.5" text-anchor="middle">candidate</text>
  </g>

  <g data-node="model-adapter">
    <rect class="fig-node" x="700" y="498" width="284" height="56" />
    <text class="fig-th" x="716" y="521" font-size="13">Model / Provider Adapter</text>
    <text class="fig-muted" x="716" y="540" font-size="11">identity · catalog · protocol · usage</text>
  </g>
  
  <path class="fig-edge" data-edge="runtime-model" d="M 442 598 H 680 V 556" marker-end="url(#fig-ownership-arrow)" /><text class="fig-muted" x="560" y="592" font-size="10">uses</text>
  <g data-node="environment">
    <rect class="fig-node" x="700" y="572" width="284" height="52" />
    <text class="fig-th" x="716" y="593" font-size="13">Environment</text>
    <text class="fig-muted" x="716" y="611" font-size="11">files · process · network · permissions</text>
  </g>
  <text class="fig-muted" x="560" y="626" font-size="10">executes in</text>
  <path class="fig-edge" data-edge="runtime-environment" d="M 442 614 H 698" marker-end="url(#fig-ownership-arrow)" />

  <path class="fig-trace" data-edge="candidates-return" d="M 360 612 H 316 V 226 H 300" marker-end="url(#fig-ownership-arrow)" /><path class="fig-trace" data-edge="events-return" d="M 360 604 H 340 V 470 H 200 V 462" marker-end="url(#fig-ownership-arrow)" /><g data-node="runtime-store"><rect class="fig-node" x="96" y="418" width="208" height="44" /><text class="fig-th" x="112" y="437" font-size="12">Host runtime store</text><text class="fig-muted" x="112" y="454" font-size="10.5">run events · telemetry</text></g>
  <text class="fig-muted" x="26" y="640" font-size="11">dashed = candidate, not connected</text><text class="fig-muted" x="26" y="290" font-size="11">two returns, two owners:</text><text class="fig-muted" x="26" y="306" font-size="11">candidates → Core via the</text><text class="fig-muted" x="26" y="322" font-size="11">extension work adapter;</text><text class="fig-muted" x="26" y="338" font-size="11">events · telemetry → host</text><text class="fig-muted" x="26" y="354" font-size="11">runtime store (trace)</text>

  <text class="fig-muted" x="700" y="66" font-size="12">Work Core never imports a provider</text>
  <text class="fig-muted" x="700" y="86" font-size="12">or a runtime object. Replacing the</text>
  <text class="fig-muted" x="700" y="106" font-size="12">runtime changes the adapter and its</text>
  <text class="fig-muted" x="700" y="126" font-size="12">configuration; the work stays where it is.</text>
  <text class="fig-muted" x="700" y="160" font-size="12">Execution success is an observation.</text>
  <text class="fig-muted" x="700" y="180" font-size="12">Effect comes only through Review,</text>
  <text class="fig-muted" x="700" y="200" font-size="12">Authority and the Core's commit (F2).</text><text class="fig-label" x="700" y="250" font-size="10.5">COMPOSITION</text><text class="fig-muted" x="700" y="270" font-size="11.5">Work Core holds decisions and evidence.</text><text class="fig-muted" x="700" y="288" font-size="11.5">Work Compiler describes a planned role.</text><text class="fig-muted" x="700" y="306" font-size="11.5">Pi provides the running execution loop.</text><text class="fig-muted" x="700" y="324" font-size="11.5">Codex and DSH remain alternatives</text><text class="fig-muted" x="700" y="342" font-size="11.5">for future runtime adapters.</text>
</svg>
