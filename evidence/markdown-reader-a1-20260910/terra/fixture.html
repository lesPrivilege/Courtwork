<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/web/styles.css"><link rel="stylesheet" href="/web/markdown-reader.css"><style>body{margin:0;padding:20px;background:var(--frame)} main{max-width:1100px;margin:auto} #reader{min-width:0}</style></head><body><main><div id="reader"></div></main><script type="module">
import {projectMarkdown, sha256Text} from '/web/markdown-source.mjs';
import {createMarkdownReader} from '/web/markdown-reader.mjs';
window.__copied = [];
Object.defineProperty(navigator, 'clipboard', {configurable:true, value:{writeText:async text => window.__copied.push(String(text))}});
const source = `\uFEFF# 判例 review 😀\r\n\r\nRepeat &amp; entity.\r\n\r\nRepeat &amp; entity.\r\n\r\n<image src="https://invalid.example/image.png" onerror="window.__unsafe = true">\r\n\r\n[Safe link](https://example.com/path) and [bad](javascript:alert(1)).\r\n\r\n| Head | A very long unbroken table value xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx |\r\n| --- | --- |\r\n| 值 | 😀 |\r\n\r\n\`\`\`mermaid\r\ngraph TD\r\n\`\`\``;
const identity = {kind:'content-version',sessionId:'session-evidence',runId:'run-evidence',path:'review.md',sha256:await sha256Text(source)};
window.__source = source;
window.__projection = await projectMarkdown(source, identity);
window.__reader = createMarkdownReader(document.querySelector('#reader'));
window.__reader.render(window.__projection);
</script></body></html>
