<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pi lane · dev 入口</title>
    <style>
      /* dev 入口不属产品面，不走设计门语汇：只求看得清、读得出。 */
      :root { color-scheme: light dark; }
      body { margin: 0; font: 14px/1.6 ui-sans-serif, system-ui, sans-serif; }
      header { padding: 12px 16px; border-bottom: 1px solid #8884; }
      header h1 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
      #status { font-size: 12px; opacity: .8; white-space: pre-wrap; }
      #status.bad { color: #c0392b; opacity: 1; }
      main { padding: 16px; max-width: 900px; }
      form { display: flex; gap: 8px; margin-bottom: 16px; }
      input[type=text] { flex: 1; padding: 8px; border: 1px solid #8886; border-radius: 4px; background: transparent; color: inherit; }
      button { padding: 8px 16px; border: 1px solid #8886; border-radius: 4px; background: transparent; color: inherit; cursor: pointer; }
      button[disabled] { opacity: .5; cursor: default; }
      .entry { border-left: 3px solid #8884; padding: 4px 0 4px 10px; margin: 8px 0; }
      .entry .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .6; }
      .entry pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 ui-monospace, monospace; }
      .tool { border-left-color: #2980b9; }
      .error { border-left-color: #c0392b; }
      .done { border-left-color: #27ae60; }
    </style>
  </head>
  <body>
    <header>
      <h1>pi lane · dev 入口（只读）</h1>
      <div id="status">正在读取状态……</div>
    </header>
    <main>
      <form id="ask">
        <input type="text" id="text" placeholder="就授权文件夹里的 md 提问，例如：把这些文件里提到的合同编号列出来" autocomplete="off" />
        <button type="submit" id="send">提问</button>
      </form>
      <div id="log"></div>
    </main>
    <script type="module">
      const statusEl = document.getElementById('status');
      const logEl = document.getElementById('log');
      const formEl = document.getElementById('ask');
      const textEl = document.getElementById('text');
      const sendEl = document.getElementById('send');

      function append(kind, body, className = '') {
        const entry = document.createElement('div');
        entry.className = `entry ${className}`;
        const label = document.createElement('div');
        label.className = 'kind';
        label.textContent = kind;
        const pre = document.createElement('pre');
        pre.textContent = body;
        entry.append(label, pre);
        logEl.append(entry);
        entry.scrollIntoView({ block: 'end' });
      }

      async function refreshStatus() {
        const status = await (await fetch('/api/status')).json();
        statusEl.className = status.configured ? '' : 'bad';
        statusEl.textContent = [
          `授权文件夹：${status.root}`,
          `模型：${status.model ?? '（无）'}　可用工具：${status.tools.join('、')}　已禁用：${status.disabled.join('、')}`,
          status.detail,
        ].join('\n');
        sendEl.disabled = !status.configured;
      }

      function renderEvent(event) {
        if (event.type === 'message_end' && event.message?.role === 'assistant') {
          const text = (event.message.content ?? [])
            .filter((block) => block.type === 'text')
            .map((block) => block.text)
            .join('\n');
          if (text.trim()) append('模型', text);
          return;
        }
        if (event.type === 'tool_execution_start') {
          append(`工具调用 · ${event.toolName}`, JSON.stringify(event.args, null, 2), 'tool');
          return;
        }
        if (event.type === 'tool_execution_end') {
          const text = (event.result?.content ?? [])
            .filter((block) => block.type === 'text')
            .map((block) => block.text)
            .join('\n');
          append(`工具结果 · ${event.toolName}${event.isError ? '（被拒/失败）' : ''}`, text, event.isError ? 'error' : 'tool');
          return;
        }
        if (event.type === 'lane_error') {
          append('出错', event.message, 'error');
          return;
        }
        if (event.type === 'lane_done') {
          const { turns, usd, exceeded, reason } = event.budget;
          append('本轮结束', `回合 ${turns}　开销 $${usd.toFixed(4)}${exceeded ? `　已停：${reason}` : ''}`, 'done');
        }
      }

      formEl.addEventListener('submit', async (submitEvent) => {
        submitEvent.preventDefault();
        const text = textEl.value.trim();
        if (!text) return;
        append('提问', text);
        textEl.value = '';
        sendEl.disabled = true;

        const response = await fetch('/api/prompt', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        if (!response.ok) {
          append('出错', (await response.json()).error, 'error');
          sendEl.disabled = false;
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const frames = buffer.split('\n\n');
          buffer = frames.pop() ?? '';
          for (const frame of frames) {
            const line = frame.split('\n').find((candidate) => candidate.startsWith('data: '));
            if (line) renderEvent(JSON.parse(line.slice(6)));
          }
        }
        sendEl.disabled = false;
        await refreshStatus();
      });

      refreshStatus();
    </script>
  </body>
</html>
