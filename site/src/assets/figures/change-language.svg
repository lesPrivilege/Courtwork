<svg class="fig fig-diff" viewBox="0 0 720 188" role="img" aria-labelledby="fig-change-language-title fig-change-language-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-change-language-title">One-colour change language</title>
  <desc id="fig-change-language-desc">Sample change in notice.md: lines that were there stay grey, the new line is red, and only the words that are actually new sit on a solid red block; the removed words sit on a grey block. Minus and plus markers and line numbers carry the meaning without colour. 2 added, 1 removed. A display sample, not a recorded artifact comparison.</desc>
  <text class="fig-label" x="16" y="20" font-size="11">NOTICE.MD · 2 ADDED · 1 REMOVED</text>
  <line class="fig-rule" data-deco="rule" x1="16" y1="30" x2="704" y2="30" />
  <g data-node="row-1" data-diff="context">
    <text class="fig-label fig-diff-no" x="33.6" y="44" font-size="12" textLength="14.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">12</text>
    <text class="fig-label fig-diff-no" x="65.6" y="44" font-size="12" textLength="14.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">12</text>
    <text class="fig-diff-mark fig-diff-old" x="92" y="44" font-size="12" textLength="7.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> </text>
    <text class="fig-diff-old" x="112" y="44" font-size="12" textLength="100.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## Termination</text>
  </g>
  <g data-node="row-2" data-diff="context">
    <text class="fig-label fig-diff-no" x="33.6" y="66" font-size="12" textLength="14.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">13</text>
    <text class="fig-label fig-diff-no" x="65.6" y="66" font-size="12" textLength="14.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">13</text>
    <text class="fig-diff-mark fig-diff-old" x="92" y="66" font-size="12" textLength="7.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> </text>
    <text class="fig-diff-old" x="112" y="66" font-size="12" textLength="0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"></text>
  </g>
  <g data-node="row-3" data-diff="del">
    <text class="fig-label fig-diff-no" x="33.6" y="88" font-size="12" textLength="14.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">14</text>
    <text class="fig-diff-mark fig-diff-old" x="92" y="88" font-size="12" textLength="7.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">−</text>
    <text class="fig-diff-old" x="112" y="88" font-size="12" textLength="259.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Either party may end this agreement </text>
    <rect class="fig-diff-old-block" x="371.2" y="77" width="57.6" height="17" rx="2" />
    <text class="fig-diff-old" x="371.2" y="88" font-size="12" textLength="57.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">at will.</text>
  </g>
  <g data-node="row-4" data-diff="add">
    <text class="fig-label fig-diff-no" x="65.6" y="110" font-size="12" textLength="14.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">14</text>
    <text class="fig-diff-mark fig-diff-new" x="92" y="110" font-size="12" textLength="7.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">+</text>
    <text class="fig-diff-new" x="112" y="110" font-size="12" textLength="259.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Either party may end this agreement </text>
    <rect class="fig-diff-block" x="371.2" y="99" width="194.4" height="17" rx="2" />
    <text class="fig-diff-block-ink" x="371.2" y="110" font-size="12" textLength="194.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">on 30 days' written notice.</text>
  </g>
  <g data-node="row-5" data-diff="context">
    <text class="fig-label fig-diff-no" x="33.6" y="132" font-size="12" textLength="14.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">15</text>
    <text class="fig-label fig-diff-no" x="65.6" y="132" font-size="12" textLength="14.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">15</text>
    <text class="fig-diff-mark fig-diff-old" x="92" y="132" font-size="12" textLength="7.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> </text>
    <text class="fig-diff-old" x="112" y="132" font-size="12" textLength="244.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Notice is effective when received.</text>
  </g>
  <g data-node="row-6" data-diff="add">
    <text class="fig-label fig-diff-no" x="65.6" y="154" font-size="12" textLength="14.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">16</text>
    <text class="fig-diff-mark fig-diff-new" x="92" y="154" font-size="12" textLength="7.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">+</text>
    <text class="fig-diff-new" x="112" y="154" font-size="12" textLength="432" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Obligations accrued before the end date survive termination.</text>
  </g>
</svg>
