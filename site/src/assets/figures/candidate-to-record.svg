<svg class="fig" viewBox="0 0 968 568" role="img" aria-labelledby="candidate-to-record-title candidate-to-record-desc" xmlns="http://www.w3.org/2000/svg">
<title id="candidate-to-record-title">A candidate becomes the work</title>
<desc id="candidate-to-record-desc">当前Matter版本7中的正式成果、来源与义务被投影为本次执行的上下文：来源s-1版本2，来源集合修订3。执行产生候选c-11及单独的运行记录。候选绑定集合修订3与证据，经验证、授权和明确的接受决定后，Work Core提交正式成果与回执，Matter进入版本8，供下一次执行继续。此图画出人接受这一候选的实例。运行记录可作为证据引用，但不自动成为正式成果；较早候选c-9和c-10仍保留其过期来源。</desc>
<defs><marker id="candidate-to-record-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="currentColor"/></marker></defs>
