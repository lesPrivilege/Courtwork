name: Runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-runtime:
    name: Node ${{ matrix.node }} · synthetic runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22.19.0"
          - "24.x"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Source: @anthropic-ai/sandbox-runtime 0.0.77 README, "Platform-Specific Dependencies" (Linux requires bubblewrap, socat, ripgrep).
      - name: Install check sandbox tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      # Source: same README, "Ubuntu 24.04+ note" (AppArmor strips capabilities from unprivileged user namespaces; bubblewrap needs them).
      - name: Allow capability-bearing unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install locked dependencies
        run: npm --prefix app ci --ignore-scripts
      - name: Verify fixed historical test inputs
        run: node app/scripts/check-historical-fixtures.mjs
      - name: Run bounded synthetic tests
        run: npm --prefix app test
      - name: Run deterministic runtime smoke
        run: npm --prefix app run smoke
      - name: Check repository documentation links
        run: node tools/check-doc-links.mjs
